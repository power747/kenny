<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>할 일 목록</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>할 일</h1>
      <p class="today" id="today"></p>
    </header>

    <form class="new-todo" id="new-todo-form" autocomplete="off">
      <input id="new-todo-title" type="text" placeholder="무엇을 해야 하나요?" maxlength="200" required aria-label="새 할 일">
      <input id="new-todo-due" type="date" aria-label="마감일 (선택)">
      <button type="submit">추가</button>
    </form>

    <section class="toolbar" aria-label="필터">
      <label class="toggle-all">
        <input id="toggle-all" type="checkbox">
        <span>모두 완료</span>
      </label>
      <div class="filters" role="tablist">
        <button type="button" data-filter="all" role="tab">전체</button>
        <button type="button" data-filter="active" role="tab">진행 중</button>
        <button type="button" data-filter="completed" role="tab">완료</button>
      </div>
    </section>

    <ul class="todo-list" id="todo-list"></ul>
    <p class="empty" id="empty" hidden></p>

    <footer class="app-footer">
      <span id="count"></span>
      <button type="button" id="clear-completed" class="link">완료 항목 삭제</button>
    </footer>

    <p class="hint">더블클릭하여 수정 · Enter 저장 · Esc 취소</p>
  </main>

  <template id="todo-item-template">
    <li class="todo-item">
      <input class="toggle" type="checkbox" aria-label="완료 표시">
      <div class="body">
        <span class="title"></span>
        <span class="due"></span>
      </div>
      <input class="edit" type="text" maxlength="200" aria-label="할 일 수정">
      <button type="button" class="delete" aria-label="삭제">×</button>
    </li>
  </template>

  <script src="app.js"></script>
</body>
</html>
